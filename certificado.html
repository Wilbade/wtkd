<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="48x48" href="/public/assets/images/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/public/assets/images/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/assets/images/apple-touch-icon.png">
    <title>Certificado de Exame — WTKD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #52525e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #certificados-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* Estilo do Certificado Individual (A4 Paisagem) */
        .certificado {
            width: 297mm;
            height: 210mm;
            background: #fff;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10mm; /* Espaço externo da moldura */
        }

        /* Moldura Dupla (fina externa, grossa interna) */
        .moldura-dupla {
            width: 100%;
            height: 100%;
            border: 2px solid #000; /* Fina Externa */
            padding: 5px;
            position: relative;
        }
        .moldura-interna {
            width: 100%;
            height: 100%;
            border: 5px solid #000; /* Grossa Interna */
            padding: 20px;
            position: relative;
        }

        /* HEADER LOGOS E TEXTO */
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 30px;
            margin-top: 10px;
        }

        .logo-esq, .logo-dir {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }

        .header-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .world-musa {
            font-family: Arial, sans-serif;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .taekwondo-brasil {
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .brasil-badge {
            background: #2a9d8f; /* Verde-azulado base, ajuste de imagem */
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 26px;
            letter-spacing: 0;
            background: linear-gradient(to right, #009c3b 33%, #ffdf00 33%, #ffdf00 66%, #002776 66%); /* Cores do BR */
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .korean-subtitle {
            margin-top: 15px;
            font-size: 18px;
            letter-spacing: 12px;
            color: #333;
        }

        /* TÍTULO CERTIFICADO DE GUB */
        .titulo-certificado {
            font-family: 'Times New Roman', serif;
            font-size: 38px;
            font-weight: bold;
            color: #b59b58; /* Dourado */
            text-align: center;
            letter-spacing: 4px;
            margin: 15px 0 25px 0;
        }

        /* TEXTO CENTRAL */
        .corpo-texto {
            font-size: 19px;
            line-height: 1.8;
            text-align: justify;
            width: 82%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .corpo-texto .linha-aluno {
            display: inline-block;
            min-width: 60%;
            border-bottom: 1px solid #000;
            text-align: center;
            font-weight: bold;
            font-size: 24px;
            font-family: Arial, sans-serif;
            font-style: italic;
            padding: 0 10px;
            line-height: 1.2;
        }

        .corpo-texto .linha-curta {
            display: inline-block;
            min-width: 40px;
            border-bottom: 1px solid #000;
            text-align: center;
            font-weight: bold;
            padding: 0 5px;
            line-height: 1.2;
        }

        /* TEXTO COREANO VERTICAL DIREITO */
        .korean-vertical {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 80px;
            font-weight: bold;
            line-height: 1.1;
            text-align: center;
            color: #000;
        }

        /* ASSINATURAS (3 Colunas) */
        .assinaturas-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 90%;
            margin: 30px auto 0 auto;
            position: relative;
        }

        .assinatura {
            text-align: center;
            font-size: 12px;
            line-height: 1.3;
            width: 32%;
            position: relative;
        }

        .assinatura strong {
            font-size: 13px;
            display: block;
            margin-bottom: 2px;
        }

        .assinatura-img-container {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .assinatura-carimbo-coreano {
            position: absolute;
            left: -20px;
            top: -10px;
            height: 50px;
        }
        .assinatura-caneta-azul {
            height: 50px;
            opacity: 0.8;
            transform: rotate(-10deg);
        }

        /* DATA RODAPÉ */
        .data-rodape {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 13px;
            font-style: italic;
        }

        /* BOTOES */
        .acoes {
            position: fixed;
            bottom: 30px;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background: #006ae6; }
        .btn-fechar { background: #3a3a3c; }

        @media print {
            body { background: transparent; padding: 0; }
            .acoes { display: none !important; }
            .certificado {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
            #certificados-container { gap: 0; }
            @page { size: A4 landscape; margin: 0; }
        }
        
        .loading {
            color: white;
            font-size: 24px;
            margin-top: 100px;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XQ0DXE9LJ9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XQ0DXE9LJ9');
    </script>
</head>
<body>

    <div class="acoes">
        <button class="btn btn-fechar" onclick="window.close()">Voltar</button>
        <button class="btn" onclick="window.print()">🖨️ Imprimir Agora</button>
    </div>

    <div id="certificados-container">
        <div class="loading">Gerando certificados, aguarde...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://pkbusphlutnodgconbbc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AXK9wUTEpz-rSdmXYn2SUA_u8O_u6P0";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Mapeamento de Faixa para GUB
        const MAPA_GUB = {
            'branca': 10,
            'ponta amarela': 9,
            'amarela': 8,
            'ponta verde': 7,
            'verde': 6,
            'ponta azul': 5,
            'azul': 4,
            'ponta vermelha': 3,
            'vermelha': 2,
            'ponta preta': 1
        };

        // Meses em português
        const MESES = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];



        async function gerarCertificados() {
            const urlParams = new URLSearchParams(window.location.search);
            const idsParam = urlParams.get('ids');

            if (!idsParam) {
                document.getElementById('certificados-container').innerHTML = '<div class="loading">Nenhum ID de aluno fornecido.</div>';
                return;
            }

            const ids = idsParam.split(',').filter(id => id.trim() !== '');
            const container = document.getElementById('certificados-container');
            container.innerHTML = ''; 

            const hoje = new Date(); // Usado só como fallback

            for (const idAluno of ids) {
                const { data: aluno } = await _supabase
                    .from('alunos')
                    .select('nome')
                    .eq('id', idAluno)
                    .single();

                const { data: exames } = await _supabase
                    .from('exames_notas')
                    .select('nota, faixa_avaliada, nome_real_avaliador, data_exame')
                    .eq('id_aluno', idAluno)
                    .order('data_exame', { ascending: false })
                    .limit(1);

                if (aluno && exames && exames.length > 0) {
                    const exame = exames[0];
                    
                    // Conta quantos exames o aluno fez até a data deste exame para saber qual é o "Xº teste"
                    let numeroTeste = 1;
                    const dataRef = exame.data_exame || new Date().toISOString();
                    const { count } = await _supabase
                        .from('exames_notas')
                        .select('*', { count: 'exact', head: true })
                        .eq('id_aluno', idAluno)
                        .lte('data_exame', dataRef);
                    if (count) numeroTeste = count;

                    let novaFaixa = exame.faixa_avaliada;
                    
                    const { data: progresso } = await _supabase
                        .from('progresso_tecnico')
                        .select('faixa_atual')
                        .eq('aluno_id', idAluno)
                        .single();

                    if (progresso && progresso.faixa_atual) {
                        novaFaixa = progresso.faixa_atual.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ').replace('1º dan', '1º Dan');
                    }
                    
                    const gub = MAPA_GUB[novaFaixa.toLowerCase()] || "X";
                    
                    // Tratamento para não deixar número quebrado se não quiser
                    const notaFinal = Math.round(exame.nota);
                    
                    // Pega a data exata em que o exame foi gravado no banco de dados
                    const dataRealDoExame = exame.data_exame ? new Date(exame.data_exame) : hoje;
                    const dataExtenso = `${dataRealDoExame.getDate()} de ${MESES[dataRealDoExame.getMonth()]} de ${dataRealDoExame.getFullYear()}`;
                    
                    const cert = document.createElement('div');
                    cert.className = 'certificado';
                    cert.innerHTML = `
                        <div class="moldura-dupla">
                            <div class="moldura-interna">
                                
                                <!-- CABEÇALHO -->
                                <div class="cabecalho">
                                    <img src="public/assets/images/logo1.png" class="logo-esq" alt="Wil TKD Team" onerror="this.style.visibility='hidden'">
                                    
                                    <div class="header-center">
                                        <div class="world-musa">WORLD MUSA</div>
                                        <div class="taekwondo-brasil">TAEKWONDO <span class="brasil-badge">BRASIL</span></div>
                                        <div class="korean-subtitle">태 권 도  마 르 케 시 니</div>
                                    </div>

                                    <img src="public/assets/images/musa.png" class="logo-dir" alt="WMT Brasil" onerror="this.style.visibility='hidden'">
                                </div>

                                <!-- TÍTULO -->
                                <div class="titulo-certificado">CERTIFICADO DE GUB</div>

                                <!-- TEXTO PRINCIPAL -->
                                <div class="corpo-texto">
                                    <p style="text-align: center; margin-bottom: 15px;">Conferimos o presente "CERTIFICADO DE GUB" ao(à) aluno(a)</p>
                                    <p style="text-align: center; margin-bottom: 15px;">
                                        <span class="linha-aluno">${aluno.nome}</span>, por
                                    </p>
                                    <p style="text-align: justify;">
                                        sua aprovação no <span class="linha-curta">${numeroTeste}º</span> teste de promoção de faixa da academia 
                                        Wil TaeKwonDo Tean Marchesini, realizado de acordo com os regulamentos da Liga de TaeKwonDo do Estado de São Paulo — LITESP, 
                                        passando o titular, a partir desta data, ao grau de <strong>${gub}º GUB (Faixa ${novaFaixa})</strong> com média final de <span class="linha-curta">${notaFinal}</span>%.
                                    </p>
                                </div>

                                <!-- TEXTO COREANO LATERAL DIREITO -->
                                <div class="korean-vertical">태<br>권<br>도</div>

                                <!-- ASSINATURAS -->
                                <div class="assinaturas-container">
                                    <div class="assinatura">
                                        <strong>Grão Mestre José Alberto dos Santos</strong>
                                        Presidente W.M.T.K.D. Brasil<br>
                                        8º Dan
                                    </div>
                                    
                                    <img src="public/assets/images/carimbo.png" style="position: absolute; left: 33%; top: 40px; transform: translateX(-50%); height: 70px; z-index: 10;" onerror="this.style.display='none'">

                                    <div class="assinatura">
                                        <strong>Mestre Fabricio Marchesini Fernandes</strong>
                                        Sabonim 4º Dan<br>
                                        CREF nº 042.659-G/SP
                                    </div>
                                    <div class="assinatura">
                                        <strong>Wiliam Elteto Longo</strong>
                                        Kyosanim 1º Dan<br>
                                        <img src="public/assets/images/AssiWiliam.png" class="assinatura-caneta-azul" style="margin-top: 5px; display: block; margin-left: auto; margin-right: auto;" onerror="this.style.display='none'">
                                    </div>
                                </div>

                                <!-- DATA (RODAPÉ) -->
                                <div class="data-rodape">
                                    São Bernardo do Campo, ${dataExtenso}.
                                </div>

                            </div>
                        </div>
                    `;
                    container.appendChild(cert);
                }
            }

            if (container.children.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum exame encontrado para os IDs informados.</div>';
            } else {
                setTimeout(() => window.print(), 1200);
            }
        }

        gerarCertificados();
    </script>
</body>
</html>
